<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <title>Unicast Chat</title>
</head>
<body>
    <div class="chat-container">
        
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="myName" placeholder="Register your name..." onblur="registerUser()" class="register-input">
            </div>
            <div id="userList" class="user-list">
                <div class="user-item" style="justify-content: center; color: #888;">Waiting to connect...</div>
            </div>
        </div>

        <!-- Right Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h3 id="activeChatName">Select a chat to start messaging</h3>
            </div>

            <div id="chat-box" class="chat-box"></div>

            <div id="typingIndicator" class="typing-indicator"></div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <script>
        const socket = io();
        let typingTimeout = null;
        let currentRecipient = "";

        function getTimeString() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes; 
            return hours + ':' + minutes + ' ' + ampm;
        }

        function registerUser() {
            let myName = document.getElementById('myName').value.trim();
            if(myName !== "") {
                socket.emit('register', myName);
                document.getElementById('myName').disabled = true; 
                document.getElementById('myName').style.backgroundColor = "#e9ecef";
            }
        }

        function openChat(userName) {
            currentRecipient = userName; 
            document.getElementById('activeChatName').innerText = "Chatting with " + userName;
            
            document.getElementById('chat-box').innerHTML = `
                <div class="system-notification">Loading secure chat with ${userName}...</div>
            `;
            
            let myName = document.getElementById('myName').value.trim();
            socket.emit('get_history', { me: myName, them: userName });
        }

        socket.on('load_history', function(data) {
            let box = document.getElementById('chat-box');
            box.innerHTML = ''; 
            let myName = document.getElementById('myName').value.trim();

            if (data.history.length === 0) {
                box.innerHTML = `<div class="system-notification">This is the start of your chat history.</div>`;
                return;
            }

            data.history.forEach(row => {
                let sender = row[0];
                let msg = row[1];
                let time = row[2];

                if (sender === myName) {
                    box.innerHTML += `
                        <div class="message-group my-message">
                            <div class="msg sent">${msg}</div>
                            <span class="timestamp-out">${time}</span>
                        </div>`;
                } else {
                    box.innerHTML += `
                        <div class="message-group their-message">
                            <div class="msg received">${msg}</div>
                            <span class="timestamp-out">${time}</span>
                        </div>`;
                }
            });
            box.scrollTop = box.scrollHeight;
        });

        // --- UPDATED: Draw Online AND Offline Users ---
        socket.on('update_users', function(data) {
            let userListDiv = document.getElementById('userList');
            userListDiv.innerHTML = ''; 
            let myName = document.getElementById('myName').value.trim();
            let hasOtherUsers = false;
            
            // 1. Draw ONLINE users first
            if (data.online.length > 0) {
                data.online.forEach(user => {
                    if (user !== myName) { 
                        hasOtherUsers = true;
                        let initial = user.charAt(0).toUpperCase();
                        userListDiv.innerHTML += `
                            <div class="user-item" onclick="openChat('${user}')">
                                <div class="avatar">${initial}</div>
                                <div class="user-info">
                                    <div class="user-name">${user}</div>
                                    <div class="user-status">Online</div>
                                </div>
                                <span class="online-dot"></span>
                            </div>`;
                    }
                });
            }

            // 2. Draw OFFLINE users below them
            if (data.offline.length > 0) {
                data.offline.forEach(user => {
                    if (user !== myName) { 
                        hasOtherUsers = true;
                        let initial = user.charAt(0).toUpperCase();
                        userListDiv.innerHTML += `
                            <div class="user-item" onclick="openChat('${user}')" style="opacity: 0.6;">
                                <div class="avatar" style="background: #aab8c2;">${initial}</div>
                                <div class="user-info">
                                    <div class="user-name">${user}</div>
                                    <div class="user-status">Offline</div>
                                </div>
                            </div>`;
                    }
                });
            }

            // If you are the only person who has ever joined the server
            if (!hasOtherUsers) {
                userListDiv.innerHTML = '<div class="user-item" style="justify-content: center; color: #888;">Just you on the server</div>';
            }
        });

        function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input.value.trim();
            let myName = document.getElementById('myName').value.trim();
            
            if(text !== "" && currentRecipient !== "") {
                let box = document.getElementById('chat-box');
                let time = getTimeString(); 
                
                box.innerHTML += `
                    <div class="message-group my-message">
                        <div class="msg sent">${text}</div>
                        <span class="timestamp-out">${time}</span>
                    </div>`;
                box.scrollTop = box.scrollHeight;

                socket.emit('send_message', { from: myName, to: currentRecipient, msg: text, time: time });
                input.value = "";
                
                clearTimeout(typingTimeout);
                socket.emit('stop_typing', { to: currentRecipient });
            } else if (currentRecipient === "") {
                alert("Please click a user in the sidebar to start chatting!");
            }
        }

        socket.on('receive_message', function(data) {
            let box = document.getElementById('chat-box');
            let time = data.timestamp || getTimeString(); 
            
            if (data.type === 'system') {
                box.innerHTML += `
                    <div class="system-notification">${data.msg} • ${time}</div>`;
            } else {
                box.innerHTML += `
                    <div class="message-group their-message">
                        <div class="msg received">${data.msg}</div>
                        <span class="timestamp-out">${time}</span>
                    </div>`;
            }
            box.scrollTop = box.scrollHeight;
        });

        document.getElementById("messageInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        document.getElementById("messageInput").addEventListener("input", function() {
            let myName = document.getElementById('myName').value.trim();
            if(myName !== "" && currentRecipient !== "") {
                socket.emit('typing', { from: myName, to: currentRecipient });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(function() {
                    socket.emit('stop_typing', { to: currentRecipient });
                }, 10000);
            }
        });

        socket.on('is_typing', function(data) {
            let indicator = document.getElementById('typingIndicator');
            indicator.innerText = `${data.sender} is typing...`;
            indicator.style.display = "block";
        });

        socket.on('stopped_typing', function() {
            let indicator = document.getElementById('typingIndicator');
            indicator.style.display = "none";
        });
    </script>
</body>
</html>
