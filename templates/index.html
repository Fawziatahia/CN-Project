<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <title>Unicast Chat</title>
</head>
<body>
    <div class="chat-container">
        
        <!-- NEW: Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Chats & Users</h3>
            </div>
            <div id="userList" class="user-list">
                <div class="user-item" style="justify-content: center; color: #888;">Waiting to connect...</div>
            </div>
        </div>

        <!-- NEW: Right Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h3>Messaging Room</h3>
            </div>
            
            <div class="routing-bar">
                <input type="text" id="myName" placeholder="Your Name" onblur="registerUser()">
                <input type="text" id="recipientName" placeholder="Send To...">
            </div>

            <div id="chat-box" class="chat-box"></div>

            <div id="typingIndicator" style="display: none; padding: 0 20px 5px; font-size: 12px; color: #888; font-style: italic; background: #fcfcfc;"></div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <script>
        const socket = io();
        let typingTimeout = null;

        function getTimeString() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes; 
            return hours + ':' + minutes + ' ' + ampm;
        }

        function registerUser() {
            let myName = document.getElementById('myName').value.trim();
            if(myName !== "") {
                socket.emit('register', myName);
                document.getElementById('myName').disabled = true; // Lock the name in
            }
        }

        // --- NEW: Function to open a chat and request history ---
        function openChat(userName) {
            // Auto-fill the Send To box
            document.getElementById('recipientName').value = userName;
            
            // Clear the current screen
            document.getElementById('chat-box').innerHTML = `
                <div class="system-notification">Loading secure chat with ${userName}...</div>
            `;
            
            // Ask server for Unicast history
            let myName = document.getElementById('myName').value.trim();
            socket.emit('get_history', { me: myName, them: userName });
        }

        // --- NEW: Receive and draw the history ---
        socket.on('load_history', function(data) {
            let box = document.getElementById('chat-box');
            box.innerHTML = ''; // Clear loading message
            let myName = document.getElementById('myName').value.trim();

            if (data.history.length === 0) {
                box.innerHTML = `<div class="system-notification">This is the start of your chat history.</div>`;
                return;
            }

            data.history.forEach(row => {
                let sender = row[0];
                let msg = row[1];
                let time = row[2];

                if (sender === myName) {
                    box.innerHTML += `
                        <div class="message-group my-message">
                            <div class="msg sent">${msg}</div>
                            <span class="timestamp-out">${time}</span>
                        </div>`;
                } else {
                    box.innerHTML += `
                        <div class="message-group their-message">
                            <div class="msg received">${msg}</div>
                            <span class="timestamp-out">${time}</span>
                        </div>`;
                }
            });
            box.scrollTop = box.scrollHeight;
        });

        // --- UPDATED: Make Sidebar users clickable ---
        socket.on('update_users', function(data) {
            let userListDiv = document.getElementById('userList');
            userListDiv.innerHTML = ''; 
            let myName = document.getElementById('myName').value.trim();
            
            if (data.users.length > 0) {
                data.users.forEach(user => {
                    if (user !== myName) { // Don't show ourselves in the click list
                        let initial = user.charAt(0).toUpperCase();
                        
                        // Added onclick="openChat('${user}')"
                        userListDiv.innerHTML += `
                            <div class="user-item" onclick="openChat('${user}')" style="cursor: pointer;">
                                <div class="avatar">${initial}</div>
                                <div class="user-info">
                                    <div class="user-name">${user}</div>
                                    <div class="user-status">Online</div>
                                </div>
                                <span class="online-dot"></span>
                            </div>`;
                    }
                });
            }
            if (userListDiv.innerHTML === '') {
                userListDiv.innerHTML = '<div class="user-item" style="justify-content: center; color: #888;">Just you</div>';
            }
        });

        function sendMessage() {
            let input = document.getElementById('messageInput');
            let recipient = document.getElementById('recipientName').value.trim();
            let myName = document.getElementById('myName').value.trim();
            let text = input.value.trim();
            
            if(text !== "" && recipient !== "") {
                let box = document.getElementById('chat-box');
                let time = getTimeString(); 
                
                box.innerHTML += `
                    <div class="message-group my-message">
                        <div class="msg sent">${text}</div>
                        <span class="timestamp-out">${time}</span>
                    </div>`;
                box.scrollTop = box.scrollHeight;

                // Send myName and time so the DB can save them
                socket.emit('send_message', { from: myName, to: recipient, msg: text, time: time });
                input.value = "";
            } else {
                alert("Click a user in the sidebar to chat!");
            }
        }

        socket.on('receive_message', function(data) {
            let box = document.getElementById('chat-box');
            let currentRecipient = document.getElementById('recipientName').value.trim();
            let time = data.timestamp || getTimeString(); 
            
            if (data.type === 'system') {
                box.innerHTML += `
                    <div class="system-notification">
                        ${data.msg} • ${time}
                    </div>`;
            } else {
                box.innerHTML += `
                    <div class="message-group their-message">
                        <div class="msg received">${data.msg}</div>
                        <span class="timestamp-out">${time}</span>
                    </div>`;
            }
            box.scrollTop = box.scrollHeight;
        });

        document.getElementById("messageInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        document.getElementById("messageInput").addEventListener("input", function() {
            let myName = document.getElementById('myName').value.trim();
            let recipient = document.getElementById('recipientName').value.trim();
            
            if(myName !== "" && recipient !== "") {
                socket.emit('typing', { from: myName, to: recipient });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(function() {
                    socket.emit('stop_typing', { to: recipient });
                }, 10000);
            }
        });

        const originalSendMessage = sendMessage;
        sendMessage = function() {
            originalSendMessage(); 
            let recipient = document.getElementById('recipientName').value.trim();
            clearTimeout(typingTimeout);
            socket.emit('stop_typing', { to: recipient });
        };

        socket.on('is_typing', function(data) {
            let indicator = document.getElementById('typingIndicator');
            indicator.innerText = `${data.sender} is typing...`;
            indicator.style.display = "block";
        });

        socket.on('stopped_typing', function() {
            let indicator = document.getElementById('typingIndicator');
            indicator.style.display = "none";
        });
    </script>
</body>
</html>
