<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Unicast</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="login-body">

    <div class="bg-orbs" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <span class="orb orb-4"></span>
    </div>

    <div class="login-page">
        <div class="login-card glass">
            <div class="login-logo">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            <h1 class="login-title">Welcome to Unicast</h1>
            <p class="login-sub">Pick a name and start chatting — no signup, no passwords.</p>

            <form method="POST" action="{{ url_for('login') }}" class="login-form" autocomplete="off">
                <label for="username">Your display name</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="e.g. peach"
                    required
                    autofocus
                    minlength="1"
                    maxlength="32"
                />
                <button type="submit" class="login-btn">
                    Continue <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <p class="login-footnote">By continuing you agree to be friendly. ✿</p>
        </div>
    </div>
</body>
</html>
