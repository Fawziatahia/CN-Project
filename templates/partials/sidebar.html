<aside class="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <i class="fa-solid fa-comment-dots"></i>
            <span>TalkNest</span>
        </div>
    </div>

    <div class="sidebar-section-header">
        <span>Direct Messages</span>
    </div>

    <div id="userList" class="user-list">
        <div class="user-item user-empty">Waiting to connect…</div>
    </div>

    <div class="user-panel">
        <div class="avatar avatar-sm">{{ username[0]|upper }}</div>
        <div class="user-panel-info">
            <div class="user-panel-name">{{ username }}</div>
            <div class="user-panel-status">
                <span class="status-dot"></span> Online
            </div>
        </div>
        <a href="{{ url_for('logout') }}" class="icon-btn" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </div>

    <input type="hidden" id="myName" value="{{ username }}" />
</aside>
